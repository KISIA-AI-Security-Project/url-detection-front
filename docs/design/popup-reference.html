<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>URL 분석 · Chrome Extension Mockup</title>
<style>
  :root{
    --bg:#ffffff; --surface:#ffffff; --surface-soft:#f7f8fa; --text:#17181a; --muted:#727780;
    --line:#e7e9ed; --line-strong:#d9dde3; --primary:#17181a; --primary-hover:#2a2c30;
    --amber:#a86508; --amber-soft:#fff8eb; --green:#18864b; --red:#c2352a;
    --radius-sm:10px; --radius:14px; --shadow:0 12px 36px rgba(20,22,26,.08);
    --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    --sans: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:#eef0f3;font-family:var(--sans);color:var(--text)}
  body{min-height:100vh;display:grid;place-items:start center;padding:42px 0}
  .frame{width:380px;max-height:600px;overflow:auto;background:var(--bg);border:1px solid var(--line-strong);border-radius:18px;box-shadow:var(--shadow)}
  .wrap{padding:20px}
  .brand{display:flex;align-items:center;gap:9px;margin-bottom:24px;font-weight:700;font-size:14px;letter-spacing:-.01em}
  .logo{width:22px;height:22px;border-radius:7px;background:#15171a;color:#fff;display:grid;place-items:center;flex:none}
  .logo svg{width:13px;height:13px}
  label{display:block;font-size:12px;font-weight:700;color:#5d626b;margin-bottom:8px}
  .input-wrap{position:relative}
  input{width:100%;height:44px;border:1px solid var(--line-strong);border-radius:11px;padding:0 12px;font-family:var(--mono);font-size:12px;outline:none;transition:.15s;background:#fff;color:#25272b}
  input:hover{border-color:#c8cdd5}
  input:focus{border-color:#8f959f;box-shadow:0 0 0 3px rgba(31,35,40,.08)}
  input:disabled{background:#f7f8fa;color:#7c828c}
  .error{display:none;font-size:11px;color:var(--red);margin:8px 2px 0}
  .button{height:42px;border:0;border-radius:11px;padding:0 16px;font-weight:700;font-size:13px;cursor:pointer;transition:.15s;font-family:inherit}
  .button:active{transform:translateY(1px)}
  .button.primary{width:100%;margin-top:12px;background:var(--primary);color:#fff}
  .button.primary:hover{background:var(--primary-hover)}
  .button.primary:disabled{background:#d9dde2;color:#9399a3;cursor:not-allowed}
  .button.secondary{background:#f3f4f6;color:#34373c;border:1px solid var(--line)}
  .button.secondary:hover{background:#ebeef1}
  .section{margin-top:22px;padding-top:20px;border-top:1px solid var(--line)}
  .hidden{display:none!important}
  .eyebrow{font-size:11px;font-weight:800;letter-spacing:.05em;color:#8a9099;text-transform:uppercase;margin-bottom:12px}
  .steps{display:flex;flex-direction:column;gap:12px}
  .step{display:flex;align-items:center;gap:10px;color:#969ca5;font-size:13px;font-weight:600}
  .step .dot{width:18px;height:18px;display:grid;place-items:center;flex:none}
  .step.active{color:#25272a}
  .step.done{color:#50555c}
  .step.done .dot{color:var(--green)}
  .step.active .dot{color:#25272a}
  .spinner{width:14px;height:14px;border:2px solid #cdd1d7;border-top-color:#25272a;border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .status-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .status-icon{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none}
  .status-icon.warning{background:var(--amber-soft);color:var(--amber)}
  .status-title{font-size:24px;line-height:1;font-weight:800;letter-spacing:-.04em;color:var(--amber)}
  .summary{font-size:13px;line-height:1.65;color:#464a51;margin:0 0 19px}
  .evidence{background:var(--surface-soft);border:1px solid var(--line);border-radius:13px;padding:14px}
  .evidence h3{font-size:12px;margin:0 0 10px;font-weight:800;color:#555a62}
  .evidence ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
  .evidence li{display:flex;gap:8px;align-items:flex-start;font-size:12px;line-height:1.45;color:#34373c}
  .bullet{margin-top:6px;width:5px;height:5px;border-radius:50%;background:#8d929a;flex:none}
  .ask{font-size:12px;color:#727780;margin:17px 0 10px}
  .cta{display:grid;grid-template-columns:1fr 1.35fr;gap:9px}
  .cta .button{width:100%;margin:0}
  .partial{margin-top:12px;padding:10px 12px;border:1px solid #f1dfbc;background:#fffaf0;border-radius:10px;font-size:11px;line-height:1.5;color:#846331}
  .fail{font-size:13px;color:#4c5158;line-height:1.6}
  .fail strong{display:block;color:#25272b;font-size:15px;margin-bottom:4px}
  .footnote{font-size:10px;color:#9aa0a9;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="frame" role="application" aria-label="URL 분석 Chrome Extension 목업">
  <main class="wrap">
    <header class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 3.5 19 7v5.2c0 4.4-2.8 7.2-7 8.3-4.2-1.1-7-3.9-7-8.3V7l7-3.5Z" stroke="currentColor" stroke-width="1.8"/><path d="m8.7 12.2 2.1 2.1 4.6-4.7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span>URL Guard</span>
    </header>

    <section id="inputView">
      <label for="urlInput">분석할 URL</label>
      <div class="input-wrap">
        <input id="urlInput" value="https://account-check-example.com/login" autocomplete="off" spellcheck="false" />
      </div>
      <p class="error" id="urlError">올바른 URL 형식이 아닙니다.</p>
      <button id="startBtn" class="button primary">분석 시작</button>
    </section>

    <section id="progressView" class="section hidden" aria-live="polite">
      <div class="eyebrow">고속 분석</div>
      <div class="steps" id="steps"></div>
    </section>

    <section id="resultView" class="section hidden" aria-live="polite">
      <div class="status-row">
        <div class="status-icon warning" aria-hidden="true">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M12 3.7 21 19H3L12 3.7Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 9v4.7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="17" r="1" fill="currentColor"/></svg>
        </div>
        <div class="status-title">주의</div>
      </div>
      <p class="summary">의심스러운 페이지 이동과 외부 전송 신호가 확인되었습니다.</p>

      <div class="evidence">
        <h3>핵심 근거</h3>
        <ul>
          <li><span class="bullet"></span><span>비정상 페이지 이동</span></li>
          <li><span class="bullet"></span><span>외부 도메인 로그인 전송</span></li>
          <li><span class="bullet"></span><span>인증서 이상</span></li>
        </ul>
      </div>

      <div class="partial">일부 콘텐츠 분석을 완료하지 못했습니다. 확인된 결과를 기준으로 표시합니다.</div>
      <p class="ask">더 자세한 분석을 진행할까요?</p>
      <div class="cta">
        <button id="finishBtn" class="button secondary">종료</button>
        <button id="deepBtn" class="button primary">심층 분석</button>
      </div>
    </section>

    <section id="failView" class="section hidden">
      <div class="fail"><strong>분석을 완료하지 못했습니다.</strong>잠시 후 다시 시도해주세요.</div>
      <button id="retryBtn" class="button primary">다시 시도</button>
    </section>
    <div class="footnote">Interactive UI mockup · no network request</div>
  </main>
</div>
<script>
  const input = document.getElementById('urlInput');
  const start = document.getElementById('startBtn');
  const error = document.getElementById('urlError');
  const progress = document.getElementById('progressView');
  const result = document.getElementById('resultView');
  const fail = document.getElementById('failView');
  const stepsEl = document.getElementById('steps');

  const stages = ['URL 검증','네트워크 분석','콘텐츠 분석','결과 생성'];
  let running = false;
  let timer = null;

  function normalize(raw){
    let value = raw.trim();
    if(!value) return null;
    if(!/^https?:\/\//i.test(value)) {
      if(/^[a-z][a-z0-9+.-]*:/i.test(value)) return null;
      value = 'https://' + value;
    }
    try {
      const u = new URL(value);
      if(!['http:','https:'].includes(u.protocol)) return null;
      u.protocol = u.protocol.toLowerCase();
      u.hostname = u.hostname.toLowerCase();
      return u.toString();
    } catch(e){ return null; }
  }
  function validateLive(){
    const normalized = normalize(input.value);
    start.disabled = running || !normalized;
    if(input.value.trim()==='') error.style.display='none';
  }
  input.addEventListener('input', validateLive);

  function renderSteps(activeIndex){
    stepsEl.innerHTML = stages.map((name,i)=>{
      let cls='step', icon='<span style="width:14px;height:14px;border:1.5px solid #c9cdd3;border-radius:50%;display:block"></span>';
      let suffix='';
      if(i<activeIndex){cls+=' done';icon='<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="m5 12 4 4 10-10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'}
      else if(i===activeIndex){cls+=' active';icon='<span class="spinner"></span>';suffix=' 중';}
      return `<div class="${cls}"><span class="dot">${icon}</span><span>${name}${suffix}</span></div>`;
    }).join('');
  }

  start.addEventListener('click',()=>{
    const normalized = normalize(input.value);
    if(!normalized){ error.style.display='block'; return; }
    error.style.display='none'; input.value=normalized; running=true; input.disabled=true; start.disabled=true;
    result.classList.add('hidden'); fail.classList.add('hidden'); progress.classList.remove('hidden');
    let idx=0; renderSteps(idx);
    clearInterval(timer);
    timer=setInterval(()=>{
      idx++;
      if(idx<stages.length) renderSteps(idx);
      else {
        clearInterval(timer);
        renderSteps(stages.length);
        setTimeout(()=>{progress.classList.add('hidden');result.classList.remove('hidden');running=false;},450);
      }
    },700);
  });

  function reset(){
    clearInterval(timer); running=false; input.disabled=false; input.value='https://account-check-example.com/login';
    progress.classList.add('hidden'); result.classList.add('hidden'); fail.classList.add('hidden');
    error.style.display='none'; validateLive(); input.focus();
  }
  document.getElementById('finishBtn').addEventListener('click',reset);
  document.getElementById('retryBtn').addEventListener('click',reset);
  document.getElementById('deepBtn').addEventListener('click',()=>{
    window.open('analysis.html?from=popup','_blank');
  });
  validateLive();
</script>
</body>
</html>
