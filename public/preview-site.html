<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>예시 배송 페이지</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#253244;font:16px/1.6 system-ui,sans-serif}header{padding:24px 8%;background:#fff;border-bottom:1px solid #dde3eb;font-weight:750;font-size:24px;color:#164a7b}small{display:block;font-size:12px;font-weight:400;color:#627487}main{max-width:560px;margin:72px auto;padding:36px;background:#fff;border:1px solid #dde3eb;border-radius:8px}h1{font-size:26px;margin:0 0 12px}p{color:#627487;margin:0 0 32px}label{display:block;font-size:14px;margin:20px 0 8px}input{height:46px;width:100%;border:1px solid #cfd8e4;border-radius:5px;background:#fff}button{width:100%;height:48px;background:#164a7b;color:#fff;border:0;border-radius:5px;margin-top:28px;font-size:16px}footer{text-align:center;color:#627487;font-size:12px;margin-top:32px}</style>
